[project]
name = "packet-analyzer"
version = "1.0.0"
description = "Analyseur de paquets reseau intelligent : capturer, analyser, comprendre, expliquer."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "scapy>=2.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
supabase = ["supabase>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
